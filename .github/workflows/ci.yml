name: CI

on:
  push:
    branches: ["main", "m0-m6-full"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRON_SECRET: ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
      MOCK_AUTH_ALLOW_PRODUCTION_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm diambil dari "packageManager" di package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + database tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e
